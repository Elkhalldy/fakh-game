<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>فخ العباقرة - لعبة العائلة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg1: #1e1b4b;
      --bg2: #312e81;
      --accent: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --pink: #ec4899;
      --cyan: #06b6d4;
      --text: #ffffff;
      --muted: #cbd5e1;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: 'Cairo', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg1), var(--bg2), #4c1d95);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px;
      overflow-x: hidden;
    }

    .container { width: 100%; max-width: 560px; margin: auto; position: relative; z-index: 2; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.84rem;
      gap: 6px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.32);
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      font-family: inherit;
      font-size: 0.82rem;
    }

    .exit-pill {
      background: rgba(239, 68, 68, 0.28);
      border-color: rgba(239, 68, 68, 0.7);
      color: #fecaca;
      cursor: pointer;
    }

    .dot { width: 9px; height: 9px; border-radius: 50%; background: #fbbf24; }
    .dot.ok { background: var(--green); }
    .dot.err { background: var(--red); }

    .confirm-bar {
      background: rgba(15, 23, 42, 0.94);
      border: 2px solid var(--red);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 12px;
      text-align: center;
      display: none;
    }

    .card {
      background: rgba(255, 255, 255, 0.11);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, h2, h3 { margin: 0 0 10px 0; text-align: center; }

    .logo {
      font-size: 2.15rem;
      font-weight: 900;
      background: linear-gradient(to left, #fde047, #f472b6, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 4px;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.93rem;
      margin-bottom: 16px;
    }

    label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.94rem; }

    input[type="text"], input[type="tel"], select {
      width: 100%;
      padding: 12px 15px;
      border-radius: 14px;
      border: 2px solid rgba(255,255,255,0.2);
      background: rgba(15, 23, 42, 0.62);
      color: #fff;
      font-family: inherit;
      font-size: 1.03rem;
      font-weight: 700;
      outline: none;
      margin-bottom: 13px;
    }

    input:focus, select:focus { border-color: var(--accent); }

    .avatars-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 7px;
      margin-bottom: 16px;
    }

    .avatar-btn {
      font-size: 1.55rem;
      padding: 7px 0;
      border-radius: 13px;
      border: 2px solid rgba(255,255,255,0.16);
      background: rgba(255,255,255,0.07);
      cursor: pointer;
      transition: transform 0.14s, border-color 0.14s, background 0.14s;
    }

    .avatar-btn.selected {
      border-color: var(--accent);
      background: rgba(245, 158, 11, 0.3);
      transform: scale(1.08);
    }

    .btn {
      width: 100%;
      padding: 13px 18px;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: 1.04rem;
      font-weight: 900;
      cursor: pointer;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.12s;
    }

    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: linear-gradient(135deg, #f59e0b, #ea580c); box-shadow: 0 6px 20px rgba(234, 88, 12, 0.35); }
    .btn-secondary { background: linear-gradient(135deg, #06b6d4, #2563eb); box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35); }
    .btn-green { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 6px 20px rgba(5, 150, 105, 0.35); }
    .btn-pink { background: linear-gradient(135deg, #ec4899, #be185d); box-shadow: 0 6px 20px rgba(236, 72, 153, 0.3); }
    .btn-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .btn-ghost {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.22);
      font-size: 0.9rem;
      padding: 10px 14px;
    }

    .divider { text-align: center; margin: 14px 0; color: var(--muted); font-size: 0.85rem; }

    .room-code-box {
      background: rgba(0, 0, 0, 0.35);
      border: 2px dashed var(--accent);
      border-radius: 18px;
      padding: 13px;
      text-align: center;
      margin-bottom: 14px;
    }

    .room-code-num {
      font-size: 2.4rem;
      font-weight: 900;
      letter-spacing: 7px;
      color: #fde047;
      direction: ltr;
      display: inline-block;
    }

    .players-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      margin: 12px 0;
    }

    .player-chip {
      background: rgba(255,255,255,0.13);
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.88rem;
      border: 1px solid rgba(255,255,255,0.16);
    }

    .player-chip.done { background: rgba(16, 185, 129, 0.28); border-color: var(--green); }

    .kick-btn {
      background: rgba(239, 68, 68, 0.8);
      border: none;
      color: #fff;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      font-size: 0.7rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      background: rgba(255,255,255,0.15);
      padding: 4px 11px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
    }

    .badge-cat { background: rgba(236, 72, 153, 0.3); border: 1px solid rgba(236, 72, 153, 0.55); }
    .badge-timer { background: rgba(245, 158, 11, 0.28); border: 1px solid var(--accent); color: #fde047; }

    .question-box {
      background: rgba(15, 23, 42, 0.58);
      border-radius: 18px;
      padding: 17px 14px;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 900;
      line-height: 1.65;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.14);
    }

    .options-scroll { max-height: 46vh; overflow-y: auto; padding-left: 2px; }

    .option-btn {
      width: 100%;
      text-align: right;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 13px 15px;
      border-radius: 15px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 9px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .option-btn:hover:not(:disabled) { background: rgba(255,255,255,0.2); border-color: var(--accent); }
    .option-btn:disabled { opacity: 0.65; cursor: default; }

    .reveal-item {
      border-radius: 15px;
      padding: 12px 14px;
      margin-bottom: 9px;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.15);
    }

    .reveal-item.is-real { background: rgba(16, 185, 129, 0.26); border-color: var(--green); }

    .reveal-title {
      font-size: 1.02rem;
      font-weight: 900;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .reveal-meta {
      font-size: 0.83rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .voter-tag {
      background: rgba(0,0,0,0.32);
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.8rem;
      color: #fde047;
      font-weight: 700;
    }

    .info-box {
      background: rgba(56, 189, 248, 0.16);
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 15px;
      padding: 12px;
      margin: 12px 0;
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .leaderboard { margin-top: 12px; max-height: 35vh; overflow-y: auto; }

    .lb-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 13px;
      background: rgba(0,0,0,0.24);
      border-radius: 12px;
      margin-bottom: 6px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .lb-row.top1 {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.36), rgba(234, 88, 12, 0.2));
      border: 1px solid var(--accent);
    }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fde047;
      border: 2px solid var(--accent);
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 0.92rem;
      z-index: 9999;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      max-width: 92%;
      display: none;
    }

    .picker-row { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }

    .opt-pill {
      flex: 1;
      min-width: 68px;
      padding: 9px 6px;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 900;
      cursor: pointer;
    }

    .opt-pill.active { border-color: var(--accent); background: rgba(245, 158, 11, 0.3); }

    .awards-box { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }

    .award-card {
      background: rgba(255,255,255,0.1);
      border-radius: 15px;
      padding: 11px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .small-link {
      background: none;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 0.82rem;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 9px;
      display: block;
      width: 100%;
      text-align: center;
    }

    .custom-q-box {
      background: rgba(236, 72, 153, 0.14);
      border: 2px dashed rgba(236, 72, 153, 0.55);
      border-radius: 16px;
      padding: 12px;
      margin-top: 10px;
    }

    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 14px;
      top: -20px;
      z-index: 1;
      border-radius: 3px;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(105vh) rotate(720deg); opacity: 0.2; }
    }
  </style>
</head>

    let audioCtx = null;
    function playTone(freq, duration = 0.1, type = 'sine') {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.11, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playChime() {

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function normalizeAr(str) {
      return String(str || '').trim()
        .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
        .replace(/[\u064B-\u065F]/g, '').replace(/[.,،!؟?:"'()«»]/g, '').replace(/\s+/g, ' ');
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function setConnStatus(status, text) {

    function connectMQTT(onReady) {
      if (typeof mqtt === 'undefined') {
        setConnStatus('err', 'لا يوجد إنترنت');
        showToast('تأكد من اتصالك بالإنترنت');
        return;
      }

      if (mqttClient && mqttClient.connected) {
        isConnected = true;
        setConnStatus('ok', 'متصل ✅');
        if (onReady) onReady();
        return;
      }

      if (mqttClient) {
        try { mqttClient.end(true); } catch (e) {}
      }

      setConnStatus('wait', 'جاري الاتصال...');
      const broker = BROKERS[selectedBroker];

      mqttClient = mqtt.connect(broker.url, {
        clientId: 'fakh7_' + myId + '_' + Math.floor(Math.random() * 99999),
        clean: true,
        connectTimeout: 8000,
        reconnectPeriod: 2500,
        keepalive: 35
      });

      mqttClient.on('connect', () => {
        isConnected = true;
        setConnStatus('ok', 'متصل ✅');
        if (roomCode) {
          subscribeRoomTopics(roomCode);
          if (isHost && hostState) {
            mqttClient.publish(`${topicBase(roomCode)}/state`, JSON.stringify(hostState), { qos: 1, retain: true });
          } else if (!isHost) {
            publishToHost({ type: 'SYNC_REQ', playerId: myId });
          }
        }
        if (onReady) {
          const cb = onReady;
          onReady = null;
          cb();
        }
      });

      mqttClient.on('reconnect', () => setConnStatus('wait', 'إعادة الاتصال...'));
      mqttClient.on('offline', () => { isConnected = false; setConnStatus('err', 'انقطع الاتصال'); });
      mqttClient.on('error', () => { isConnected = false; setConnStatus('err', 'خطأ بالاتصال'); });

      mqttClient.on('message', (topic, message) => {
        const raw = message.toString();
        if (!raw) return;
        try {
          const data = JSON.parse(raw);
          if (topic.endsWith('/host') && isHost) handleHostAction(data);
          else if (topic.endsWith('/state') && !isHost) applyStateFromHost(data);
          else if (topic.endsWith('/events') && data.targetId === myId) {
            showToast(data.msg, 3500);
            playTone(260, 0.2, 'sawtooth');
          }
        } catch (e) {}
      });
    }

    function topicBase(code) { return `fakh-abaqera-v7/${code}`; }

    function subscribeRoomTopics(code) {
      if (!mqttClient) return;
      if (isHost) mqttClient.subscribe(`${topicBase(code)}/host`, { qos: 1 });
      else mqttClient.subscribe(`${topicBase(code)}/state`, { qos: 1 });
      mqttClient.subscribe(`${topicBase(code)}/events`, { qos: 0 });
    }

    function publishToHost(payload) {
      if (isHost) handleHostAction(payload);
      else if (mqttClient && mqttClient.connected) {
        mqttClient.publish(`${topicBase(roomCode)}/host`, JSON.stringify(payload), { qos: 1 });
      } else {
        connectMQTT(() => {
          if (mqttClient && mqttClient.connected) {
            mqttClient.publish(`${topicBase(roomCode)}/host`, JSON.stringify(payload), { qos: 1 });
          }
        });

    }

    function resumeSavedSession() {
      const s = getValidSavedSession();
      if (!s) return;

      if (s.isHost) {
        try {
          const b = JSON.parse(localStorage.getItem(HOST_BACKUP_KEY) || 'null');
          if (b && b.roomCode === s.roomCode && b.hostState) {
            isHost = true;
            roomCode = b.roomCode;
            hostState = b.hostState;
            hostSecretQuestion = b.hostSecretQuestion;
            hostSubmissions = b.hostSubmissions || {};
            hostVotes = b.hostVotes || {};
            phaseEndsAt = b.phaseEndsAt || null;
            pendingCustomQuestion = b.pendingCustomQuestion || null;
            subjectTurnIdx = b.subjectTurnIdx || 0;
            selectedRounds = hostState.totalRounds || 7;
            selectedPack = hostState.pack || 'all';
            selectedTimerSec = hostState.timerSec || 0;

            viewState = JSON.parse(JSON.stringify(hostState));
            lastRenderedKey = '';
            renderGame();
            showToast('أهلاً بعودتك! تم استعادة غرفتك ✅');

            connectMQTT(() => {
              subscribeRoomTopics(roomCode);
              rescheduleAfterWake();
              broadcastState();
            });
            return;
          }
        } catch (e) {}
      }

      joinRoom(s.roomCode);
    }

    function getExpectedRespondersCount() {
      const ids = Object.keys(hostState.players);
      if (hostState.subjectId && hostState.players[hostState.subjectId]) {
        return Math.max(1, ids.length - 1);
      }
      return ids.length;
    }

    function handleHostAction(action) {
      if (!hostState) return;

      if (action.type === 'JOIN') {
        const existing = hostState.players[action.playerId];
        if (existing) {
          existing.name = action.name;
          existing.avatar = action.avatar;
        } else {
          if (Object.keys(hostState.players).length >= MAX_PLAYERS) {
            sendEventToPlayer(action.playerId, `عذراً، الغرفة ممتلئة (${MAX_PLAYERS} لاعب)!`);
            return;
          }
          hostState.players[action.playerId] = {
            id: action.playerId, name: action.name, avatar: action.avatar,
            score: 0, fooledCount: 0, correctCount: 0, isHost: false
          };
          playTone(660, 0.12);
        }
        broadcastState();
      }
      else if (action.type === 'SYNC_REQ') {
        if (mqttClient && mqttClient.connected) {
          mqttClient.publish(`${topicBase(roomCode)}/state`, JSON.stringify(hostState), { qos: 1, retain: true });
        }
      }
      else if (action.type === 'SUBMIT_SUBJECT_TRUTH') {
        if (hostState.phase !== 'subject_answering' || action.playerId !== hostState.subjectId) return;
        const truth = String(action.text || '').trim().replace(/[.。]+$/, '');
        if (!truth) return;

        hostSecretQuestion = {
          cat: '🌟 نجم العيلة',
          q: hostState.question.q,
          a: truth,
          decoys: ['مش هقول أبداً!', 'حاجة سرية جداً', 'مفاجأة للكل!'],
          info: `دي الإجابة الحقيقية اللي كتبها ${hostState.subjectName} عن نفسه!`
        };

        hostSubmissions = {};
        hostVotes = {};
        decoyIdx = 0;
        hostState.phase = 'writing';
        hostState.question = { cat: hostSecretQuestion.cat, q: hostSecretQuestion.q, decoys: hostSecretQuestion.decoys };
        hostState.submittedIds = [];
        playChime();
        scheduleHostTimer(hostState.timerSec, startVotingPhase);
        broadcastState();
      }
      else if (action.type === 'SUBMIT_FAKE') {
        if (hostState.phase !== 'writing' || !hostSecretQuestion) return;
        if (!hostState.players[action.playerId] || action.playerId === hostState.subjectId) return;
        const cleanText = String(action.text || '').trim().replace(/[.。]+$/, '');
        if (!cleanText) return;

        const norm = normalizeAr(cleanText);
        if (norm === normalizeAr(hostSecretQuestion.a)) {
          sendEventToPlayer(action.playerId, 'دي الإجابة الحقيقية فعلاً! 👏 اكتب خدعة من تأليفك 😉');
          return;
        }

        const isDup = Object.entries(hostSubmissions).some(([pId, txt]) => pId !== action.playerId && normalizeAr(txt) === norm);
        if (isDup) {
          sendEventToPlayer(action.playerId, 'حد سبقك وكتب نفس الخدعة! 😉 غيّرها بفكرة تانية');
          return;
        }

        hostSubmissions[action.playerId] = cleanText;
        hostState.submittedIds = Object.keys(hostSubmissions);
        playTone(540, 0.08);

        if (hostState.submittedIds.length >= getExpectedRespondersCount()) {
          startVotingPhase();
        } else {
          broadcastState();
        }
      }
      else if (action.type === 'SUBMIT_VOTE') {
        if (hostState.phase !== 'voting') return;
        if (!hostState.players[action.playerId] || action.playerId === hostState.subjectId) return;
        const opt = hostState.options.find(o => o.id === action.optionId);
        if (!opt || opt.authorId === action.playerId) return;

        hostVotes[action.playerId] = action.optionId;
        hostState.votedIds = Object.keys(hostVotes);
        playTone(600, 0.08);

        if (hostState.votedIds.length >= getExpectedRespondersCount()) {
          finishVotingPhase();
        } else {
          broadcastState();
        }
      }
    }

    function applyStateFromHost(newState) {
      if (!newState || !newState.updatedAt) return;
      if (Date.now() - newState.updatedAt > 6 * 60 * 60 * 1000) return;

      if (newState.phase === 'closed') {
        showToast('أنهى المضيف الغرفة');
        leaveToHome(true);
        return;
      }

      if (!newState.players || !newState.players[myId]) {
        if (roomCode && myName) {
          publishToHost({ type: 'JOIN', playerId: myId, name: myName, avatar: myAvatar });
        }
        return;
      }

      if (viewState && newState.stateSeq < viewState.stateSeq && newState.phase === viewState.phase) return;
      const oldPhase = viewState ? `${viewState.phase}_${viewState.round}` : '';
      viewState = newState;
      saveSession();
      const newPhase = `${viewState.phase}_${viewState.round}`;
      if (oldPhase !== newPhase) playChime();
      renderGame();
    }

    function kickPlayer(targetId) {
      if (!isHost || !hostState || targetId === myId) return;
      const wasSubject = (hostState.subjectId === targetId);
      delete hostState.players[targetId];
      delete hostSubmissions[targetId];
      delete hostVotes[targetId];
      hostState.submittedIds = Object.keys(hostSubmissions);
      hostState.votedIds = Object.keys(hostVotes);

      if (wasSubject) {
        hostState.round = Math.max(0, hostState.round - 1);
        nextRound();
        return;
      }

      const expected = getExpectedRespondersCount();
      if (hostState.phase === 'writing' && expected > 0 && hostState.submittedIds.length >= expected) {
        startVotingPhase();
      } else if (hostState.phase === 'voting' && expected > 0 && hostState.votedIds.length >= expected) {
        finishVotingPhase();
      } else {
        broadcastState();
      }
    }

    function setHostOption(type, val) {
      if (type === 'rounds') selectedRounds = val;
      if (type === 'pack') selectedPack = val;
      if (type === 'timer') selectedTimerSec = val;
      if (isHost && hostState && hostState.phase === 'lobby') {
        hostState.totalRounds = selectedRounds;
        hostState.pack = selectedPack;
        hostState.timerSec = selectedTimerSec;
        broadcastState();
      }
    }

    function pickQuestion() {
      if (pendingCustomQuestion) {
        const q = pendingCustomQuestion;
        pendingCustomQuestion = null;
        return q;
      }
      const pool = hostState.pack === 'all' ? QUESTIONS : QUESTIONS.filter(q => q.pack === hostState.pack);
      let available = pool.filter(q => !usedIds.includes(q.id));
      if (available.length === 0) {
        const poolIds = new Set(pool.map(q => q.id));
        usedIds = usedIds.filter(id => !poolIds.has(id));
        available = pool;
      }
      const chosen = available[Math.floor(Math.random() * available.length)];
      usedIds.push(chosen.id);
      saveArr(USED_KEY, usedIds);
      return chosen;
    }

    function pickFamilyPrompt(subjectName) {
      let availIdx = FAMILY_PROMPTS.map((_, i) => i).filter(i => !usedFamIds.includes(i));
      if (availIdx.length === 0) {
        usedFamIds = [];
        availIdx = FAMILY_PROMPTS.map((_, i) => i);
      }
      const idx = availIdx[Math.floor(Math.random() * availIdx.length)];
      usedFamIds.push(idx);
      saveArr(USED_FAM_KEY, usedFamIds);
      return FAMILY_PROMPTS[idx].replace(/\{NAME\}/g, subjectName);
    }

    function clearHostTimer() {
      if (hostPhaseTimeout) { clearTimeout(hostPhaseTimeout); hostPhaseTimeout = null; }
      phaseEndsAt = null;
    }

    function scheduleHostTimer(sec, callback) {
      clearHostTimer();
      if (sec > 0) {
        phaseEndsAt = Date.now() + sec * 1000;
        hostPhaseTimeout = setTimeout(callback, sec * 1000);
      }
    }

    function rescheduleAfterWake() {
      if (!isHost || !hostState || !hostState.timerSec || !phaseEndsAt) return;
      if (hostState.phase !== 'writing' && hostState.phase !== 'voting') return;
      const msLeft = Math.max(5000, phaseEndsAt - Date.now());
      if (hostPhaseTimeout) clearTimeout(hostPhaseTimeout);
      hostPhaseTimeout = setTimeout(() => {
        if (hostState.phase === 'writing') startVotingPhase();
        else if (hostState.phase === 'voting') finishVotingPhase();
      }, msLeft);
    }

    function startNewGame() {
      if (!isHost) return;
      const pCount = Object.keys(hostState.players).length;
      if (selectedPack === 'family_stars' && pCount < 3) {
        showToast('باقة «نجم العيلة» تحتاج 3 لاعبين على الأقل! 🌟');
        return;
      }
      if (pCount < 2) {
        showToast('لازم ينضم لاعب واحد على الأقل معاك!');
        return;
      }
      Object.values(hostState.players).forEach(p => {
        p.score = 0; p.fooledCount = 0; p.correctCount = 0;
      });
      hostState.round = 0;
      hostState.totalRounds = selectedRounds;
      hostState.pack = selectedPack;
      hostState.timerSec = selectedTimerSec;
      subjectTurnIdx = 0;
      nextRound();
    }

    function nextRound() {
      if (!isHost) return;
      clearHostTimer();
      showCustomForm = false;
      if (hostState.round >= hostState.totalRounds) {
        hostState.phase = 'finished';
        playChime();
        broadcastState();
        return;
      }

      hostState.round += 1;
      hostSubmissions = {};
      hostVotes = {};
      decoyIdx = 0;

      if (pendingCustomQuestion || hostState.pack !== 'family_stars') {
        hostState.subjectId = null;
        hostState.subjectName = '';
        hostState.subjectAvatar = '';
        hostSecretQuestion = pickQuestion();
        hostState.phase = 'writing';
        hostState.question = {
          cat: hostSecretQuestion.cat,
          q: hostSecretQuestion.q,
          decoys: hostSecretQuestion.decoys || []
        };
        hostState.submittedIds = [];
        hostState.options = [];
        hostState.votedIds = [];
        hostState.roundSummary = null;
        playChime();
        scheduleHostTimer(hostState.timerSec, startVotingPhase);
        broadcastState();
        return;
      }

      const pIds = Object.keys(hostState.players);
      if (pIds.length < 3) {
        hostState.pack = 'all';
        hostState.round -= 1;
        nextRound();
        return;
      }
      const subjId = pIds[subjectTurnIdx % pIds.length];
      subjectTurnIdx += 1;
      const subj = hostState.players[subjId];
      const promptTxt = pickFamilyPrompt(subj.name);

      hostState.subjectId = subj.id;
      hostState.subjectName = subj.name;
      hostState.subjectAvatar = subj.avatar;
      hostState.phase = 'subject_answering';
      hostState.question = { cat: '🌟 نجم العيلة', q: promptTxt, decoys: [] };
      hostState.submittedIds = [];
      hostState.options = [];
      hostState.votedIds = [];
      hostState.roundSummary = null;
      playChime();
      broadcastState();
    }

    function skipSubjectPhase() {
      if (!isHost || hostState.phase !== 'subject_answering') return;
      hostState.round = Math.max(0, hostState.round - 1);
      nextRound();
    }

    function startVotingPhase() {
      if (!isHost || hostState.phase !== 'writing') return;
      clearHostTimer();

      const opts = Object.entries(hostSubmissions).map(([pId, text]) => ({
        id: 'opt_' + pId, text, authorId: pId
      }));
      opts.push({ id: 'opt_real', text: hostSecretQuestion.a, authorId: 'REAL' });

      hostState.options = shuffle(opts);
      hostState.phase = 'voting';
      hostVotes = {};
      hostState.votedIds = [];

      playChime();
      scheduleHostTimer(hostState.timerSec, finishVotingPhase);
      broadcastState();
    }

    function finishVotingPhase() {
      if (!isHost || hostState.phase !== 'voting') return;
      clearHostTimer();

      const votersByOpt = {};
      hostState.options.forEach(o => { votersByOpt[o.id] = []; });

      Object.entries(hostVotes).forEach(([voterId, optId]) => {
        const voter = hostState.players[voterId];
        if (!voter) return;
        const opt = hostState.options.find(o => o.id === optId);
        if (!opt) return;

        votersByOpt[optId].push({ name: voter.name, avatar: voter.avatar });

        if (opt.authorId === 'REAL') {
          voter.score += 100;
          voter.correctCount += 1;
        } else if (hostState.players[opt.authorId]) {
          hostState.players[opt.authorId].score += 50;
          hostState.players[opt.authorId].fooledCount += 1;
        }
      });

      const optionsDetail = hostState.options.map(o => {
        const isReal = o.authorId === 'REAL';
        const author = isReal ? null : hostState.players[o.authorId];
        return {
          id: o.id,
          text: o.text,
          isReal,
          authorName: author ? author.name : (hostState.subjectId ? hostState.subjectName : 'الحقيقة'),
          authorAvatar: author ? author.avatar : '✅',
          voters: votersByOpt[o.id] || []
        };
      });

      optionsDetail.sort((a, b) => (b.isReal ? 1 : 0) - (a.isReal ? 1 : 0));

      hostState.roundSummary = {
        realAnswer: hostSecretQuestion.a,
        info: hostSecretQuestion.info || 'سؤال من تأليف العيلة الحلوة! 💖',
        optionsDetail
      };
      hostState.phase = 'reveal';

      playChime();
      broadcastState();
    }

    function toggleCustomForm() {
      showCustomForm = !showCustomForm;
      const box = document.getElementById('custom-q-container');
      if (box) box.style.display = showCustomForm ? 'block' : 'none';
    }

    function saveCustomQuestion(playNextNow) {
      const qTxt = (document.getElementById('cq-text')?.value || '').trim();
      const aTxt = (document.getElementById('cq-ans')?.value || '').trim();
      if (!qTxt || !aTxt) {
        showToast('اكتب السؤال وإجابته الحقيقية الأول ✍️');
        return;
      }
      pendingCustomQuestion = {
        id: 'custom_' + Date.now(),
        pack: 'custom',
        cat: 'أسرار العيلة 💖',
        q: qTxt,
        a: aTxt,
        decoys: ['محدش يعرف السر ده!', 'حصلت بالصدفة السعيدة', 'مفاجأة من زمان أوي'],
        info: `سؤال خاص من تأليف العيلة! الإجابة الصحيحة: ${aTxt}`
      };
      showCustomForm = false;
      showToast('تم تجهيز سؤال العيلة! 🎉');
      if (playNextNow) nextRound();
    }

    function submitSubjectTruth() {
      const inp = document.getElementById('subject-truth-input');
      const val = inp ? inp.value.trim() : '';
      if (!val) { showToast('اكتب إجابتك الحقيقية الأول ✍️'); return; }
      publishToHost({ type: 'SUBMIT_SUBJECT_TRUTH', playerId: myId, text: val });
    }

    function submitFakeAnswer() {
      const inp = document.getElementById('fake-input');
      const val = inp ? inp.value.trim() : '';
      if (!val) { showToast('اكتب أي إجابة من خيالك الأول ✍️'); return; }
      if (val.length < 2) { showToast('الإجابة قصيرة أوي، زوّدها شوية!'); return; }
      publishToHost({ type: 'SUBMIT_FAKE', playerId: myId, text: val });
    }

    function suggestDecoy() {
      if (!viewState || !viewState.question || !viewState.question.decoys || !viewState.question.decoys.length) return;
      const decoys = viewState.question.decoys;
      const inp = document.getElementById('fake-input');
      if (inp) {
        inp.value = decoys[decoyIdx % decoys.length];
        decoyIdx++;
        playTone(720, 0.08);
      }
    }

    function submitVote(optionId) {
      publishToHost({ type: 'SUBMIT_VOTE', playerId: myId, optionId });
    }

    function leaveToHome(fromRemote) {
      if (isHost && !fromRemote && roomCode && mqttClient && mqttClient.connected) {
        mqttClient.publish(`${topicBase(roomCode)}/state`, JSON.stringify({ phase: 'closed', updatedAt: Date.now() }), { qos: 1, retain: true });
      }
      clearHostTimer();
      clearInterval(clientTimerInt);
      clearSavedSession();
      roomCode = '';
      isHost = false;
      viewState = null;
      hostState = null;
      lastRenderedKey = '';
      updateExitButtonVisibility();
      renderHome();
    }

    function startClientCountdown(seconds) {
      clearInterval(clientTimerInt);
      const badge = document.getElementById('timer-badge');
      if (!seconds || seconds <= 0) {
        if (badge) badge.style.display = 'none';
        return;
      }
      clientSecondsLeft = seconds;
      if (badge) {
        badge.style.display = 'inline-block';
        badge.textContent = `⏱️ ${clientSecondsLeft} ث`;
      }
      clientTimerInt = setInterval(() => {
        clientSecondsLeft -= 1;
        const b = document.getElementById('timer-badge');
        if (b) b.textContent = `⏱️ ${Math.max(0, clientSecondsLeft)} ث`;
        if (clientSecondsLeft <= 5 && clientSecondsLeft > 0) playTone(440, 0.05);
        if (clientSecondsLeft <= 0) clearInterval(clientTimerInt);
      }, 1000);
    }

        const sorted = Object.values(viewState.players).sort((a, b) => b.score - a.score);
        const winner = sorted[0];
        const topFooler = [...sorted].sort((a, b) => b.fooledCount - a.fooledCount)[0];
        const topFinder = [...sorted].sort((a, b) => b.correctCount - a.correctCount)[0];
        launchConfetti();

        app.innerHTML = `
          <div class="card">
            <h1 style="font-size:1.85rem; color:#fde047;">🏆 انتهت اللعبة!</h1>
            <div style="text-align:center; font-size:1.22rem; font-weight:900; margin-bottom:14px;">
              البطل هو: ${winner.avatar} ${escapeHtml(winner.name)} بـ ${winner.score} نقطة! 🎉
            </div>

            <div class="awards-box">
              <div class="award-card">
                <div style="font-size:1.6rem;">🦊</div>
                <div style="font-size:0.8rem; color:var(--muted);">أذكى مخادع</div>
                <div style="font-weight:900; font-size:0.95rem;">${topFooler.avatar} ${escapeHtml(topFooler.name)}</div>
                <div style="font-size:0.78rem; color:#fde047;">خدع ${topFooler.fooledCount} مرات</div>
              </div>
              <div class="award-card">
                <div style="font-size:1.6rem;">🦅</div>
                <div style="font-size:0.8rem; color:var(--muted);">صائد الحقائق</div>
                <div style="font-weight:900; font-size:0.95rem;">${topFinder.avatar} ${escapeHtml(topFinder.name)}</div>
                <div style="font-size:0.78rem; color:#10b981;">${topFinder.correctCount} إجابات صحيحة</div>
              </div>
            </div>

            <div class="leaderboard">
              ${sorted.map((p, idx) => `
                <div class="lb-row ${idx === 0 ? 'top1' : ''}">
                  <span>${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1) + '.'} ${p.avatar} ${escapeHtml(p.name)}</span>
                  <span style="color:#fde047;">${p.score} نقطة</span>
                </div>
              `).join('')}
            </div>

            ${isHost ? `
              <button class="btn btn-green" style="margin-top:14px;" onclick="startNewGame()">🔄 العبوا جيم جديد بأسئلة جديدة!</button>
            ` : `
              <div style="text-align:center; color:var(--muted); margin-top:12px;">
                ⏳ لو عايزين تلعبوا تاني، المضيف يقدر يبدأ جيم جديد!
              </div>
            `}
            <button class="btn btn-ghost" style="margin-top:10px;" onclick="leaveToHome(false)">🏠 العودة للصفحة الرئيسية</button>
          </div>
        `;
      }
    }

    function renderPlayerChip(p, isDone) {
      const kick = (isHost && p.id !== myId)
        ? `<button class="kick-btn" title="إزالة" onclick="kickPlayer('${p.id}')">✕</button>`
        : '';
      return `<span class="player-chip ${isDone ? 'done' : ''}">${p.avatar} ${escapeHtml(p.name)} ${p.isHost ? '👑' : ''} ${isDone === true ? '✅' : isDone === false ? '⏳' : ''} ${kick}</span>`;
    }

    function updateDynamicElements() {
      if (!viewState) return;
      const playersArr = Object.values(viewState.players);

      if (viewState.phase === 'lobby') {
        const countEl = document.getElementById('lobby-count');
        const listEl = document.getElementById('lobby-players');
        if (countEl) countEl.textContent = playersArr.length;
        if (listEl) listEl.innerHTML = playersArr.map(p => renderPlayerChip(p, null)).join('');

        if (isHost) {
          const remEl = document.getElementById('remaining-info');
          if (remEl) {
            remEl.textContent = viewState.pack === 'family_stars'
              ? 'أسئلة تفاعلية لا تنتهي عن أفراد العيلة! 🌟'
              : '✨ أسئلة متجددة ومختارة تلقائياً بدون تكرار';
          }
          document.querySelectorAll('.round-pill').forEach(b => b.classList.toggle('active', Number(b.dataset.v) === viewState.totalRounds));
          document.querySelectorAll('.timer-pill').forEach(b => b.classList.toggle('active', Number(b.dataset.v) === viewState.timerSec));
        }
      }

      else if (viewState.phase === 'writing') {
        const responders = viewState.subjectId ? playersArr.filter(p => p.id !== viewState.subjectId) : playersArr;
        const subIds = viewState.submittedIds || [];
        const isSubject = viewState.subjectId === myId;
        const hasSubmitted = subIds.includes(myId);
        const area = document.getElementById('writing-area');

        if (area) {
          if (isSubject) {
            area.innerHTML = `
              <div class="info-box" style="text-align:center; border-color:var(--accent); background:rgba(245,158,11,0.2);">
                🤫 إجابتك الحقيقية وصلت! استنى باقي العيلة يألفوا خدع عليها...
              </div>
            `;
          } else if (hasSubmitted) {
            area.innerHTML = `
              <div class="info-box" style="text-align:center; border-color:var(--green); background:rgba(16,185,129,0.2);">
                ✅ تم إرسال خدعتك! في انتظار باقي العائلة...
              </div>
            `;
          } else if (!document.getElementById('fake-input')) {
            area.innerHTML = `
              <label>اكتب إجابة مقنعة أو مضحكة تخدعهم بيها:</label>
              <input type="text" id="fake-input" maxlength="75" placeholder="اكتب إجابتك هنا..." />
              <div style="display:flex; gap:8px;">
                <button class="btn btn-primary" style="flex:2;" onclick="submitFakeAnswer()">إرسال الخدعة 🎭</button>
                <button class="btn btn-ghost" style="flex:1;" onclick="suggestDecoy()">اقترح لي 🪄</button>
              </div>
            `;
          }
        }

        const cEl = document.getElementById('sub-count');
        const pEl = document.getElementById('sub-players');
        if (cEl) cEl.textContent = `${subIds.length} / ${responders.length}`;
        if (pEl) pEl.innerHTML = responders.map(p => renderPlayerChip(p, subIds.includes(p.id))).join('');
      }

      else if (viewState.phase === 'voting') {
        const responders = viewState.subjectId ? playersArr.filter(p => p.id !== viewState.subjectId) : playersArr;
        const votedIds = viewState.votedIds || [];
        const isSubject = viewState.subjectId === myId;
        const hasVoted = votedIds.includes(myId);
        const optsEl = document.getElementById('voting-options');

        if (optsEl) {
          if (isSubject) {
            optsEl.innerHTML = `
              <div class="info-box" style="text-align:center; border-color:var(--accent); background:rgba(245,158,11,0.2);">
                👀 اتفرج على العيلة وهي بتحاول تخمن إجابتك الحقيقية!
              </div>
            `;
          } else if (hasVoted) {
            optsEl.innerHTML = `
              <div class="info-box" style="text-align:center; border-color:var(--cyan);">
                🗳️ تم تسجيل تصويتك! في انتظار الباقيين لكشف الحقيقة...
              </div>
            `;
          } else {
            optsEl.innerHTML = (viewState.options || []).map(opt => {
              const isMine = opt.authorId === myId;
              return `
                <button class="option-btn" ${isMine ? 'disabled' : ''} onclick="submitVote('${opt.id}')">
                  <span>${escapeHtml(opt.text)}</span>
                  <span style="font-size:0.8rem; color:var(--muted); white-space:nowrap;">
                    ${isMine ? '🤫 إجابتك' : '👈 اختر'}
                  </span>
                </button>
              `;
            }).join('');
          }
        }

        const cEl = document.getElementById('vote-count');
        const pEl = document.getElementById('vote-players');
        if (cEl) cEl.textContent = `${votedIds.length} / ${responders.length}`;
        if (pEl) pEl.innerHTML = responders.map(p => renderPlayerChip(p, votedIds.includes(p.id))).join('');
      }
    }

    const activeSession = getValidSavedSession();
    if (activeSession) {
      renderHome();
      resumeSavedSession();
    } else {
      renderHome();
      connectMQTT();
    }
  </script>
</body>
</html>
